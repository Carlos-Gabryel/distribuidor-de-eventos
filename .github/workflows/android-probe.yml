name: Android probe APK

on:
  workflow_dispatch:
  push:
    branches: [android-spike]
    paths: ["android/**", ".github/workflows/android-probe.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar o Flet
        run: pip install "flet==1.0.2" "flet-cli==1.0.2"
      - name: flet build apk
        working-directory: android/probe
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: flet build apk --yes --no-rich-output -v
      - name: Python e NDK usados
        if: always()
        run: |
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "sem NDK em $ANDROID_HOME/ndk"
          ls -la android/probe/build/apk 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: distrib-probe-apk
          path: android/probe/build/apk/*.apk
          if-no-files-found: error
