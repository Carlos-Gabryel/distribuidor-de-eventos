name: Android probe APK

on:
  workflow_dispatch:
  push:
    branches: [android-spike]
    paths: ["android/**", ".github/workflows/android-probe.yml"]

jobs:
  unicorn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - id: cache
        uses: actions/cache@v4
        with:
          path: android/wheels
          key: unicorn-wheel-${{ hashFiles('android/scripts/build_unicorn_wheel.sh') }}
      - name: Compilar libunicorn.so e montar o wheel
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y ninja-build >/dev/null
          bash android/scripts/build_unicorn_wheel.sh android/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: unicorn-wheel
          path: android/wheels/*.whl
          if-no-files-found: error

  build:
    needs: unicorn
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: unicorn-wheel
          path: android/wheels
      - name: Empacotar o pokeldn e apontar o wheel do unicorn
        run: |
          cp -r vendor/pokeldn/pokeldn android/probe/pokeldn
          find android/probe/pokeldn -name __pycache__ -prune -exec rm -rf {} +
          sed -i "s#@WHEELS@#$GITHUB_WORKSPACE/android/wheels#" android/probe/pyproject.toml
          grep -n unicorn android/probe/pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Embutir firmware e distrib (A4)
        run: |
          python build/fetch_firmware.py
          # o esptool só existe como sdist no PyPI (e o flet build usa --only-binary): embute o pacote
          pip download esptool==5.4.0 --no-deps --no-binary :all: -d /tmp/esp -q
          tar xzf /tmp/esp/esptool-5.4.0.tar.gz -C /tmp/esp
          cp -r /tmp/esp/esptool-5.4.0/esptool android/probe/esptool
          cp -r firmware android/probe/firmware
          mkdir -p android/probe/distrib/runners android/probe/distrib/platform
          for f in __init__ board runner config pokeldn_path; do cp distrib/$f.py android/probe/distrib/; done
          cp distrib/platform/__init__.py distrib/platform/inproc.py android/probe/distrib/platform/
          cp distrib/runners/__init__.py distrib/runners/flash.py android/probe/distrib/runners/
          find android/probe/distrib -name __pycache__ -prune -exec rm -rf {} +
          ls -R android/probe/firmware android/probe/distrib | head -40
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar o Flet
        run: pip install "flet==1.0.2" "flet-cli==1.0.2"
      - name: flet build apk
        working-directory: android/probe
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: flet build apk --yes --no-rich-output -v
      - name: Python e NDK usados
        if: always()
        run: |
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "sem NDK em $ANDROID_HOME/ndk"
          ls -la android/probe/build/apk 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: distrib-probe-apk
          path: android/probe/build/apk/*.apk
          if-no-files-found: error
