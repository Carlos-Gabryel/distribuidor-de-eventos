name: Android app APK

on:
  workflow_dispatch:
  push:
    branches: [android-spike]
    paths: ["distrib/**", "ui/**", "android/app/**", "build/pack_android.py", ".github/workflows/android-app.yml"]

jobs:
  unicorn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - id: cache
        uses: actions/cache@v4
        with:
          path: android/wheels
          key: unicorn-wheel-${{ hashFiles('android/scripts/build_unicorn_wheel.sh') }}
      - name: Compilar libunicorn.so e montar o wheel
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y ninja-build >/dev/null
          bash android/scripts/build_unicorn_wheel.sh android/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: unicorn-wheel-app
          path: android/wheels/*.whl
          if-no-files-found: error

  build:
    needs: unicorn
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: unicorn-wheel-app
          path: android/wheels
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar o Flet e baixar os firmwares
        run: |
          pip install "flet==1.0.2" "flet-cli==1.0.2"
          python build/fetch_firmware.py
      - name: Montar o staging e rodar o flet build apk
        run: python build/pack_android.py --wheels android/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: distribuidor-apk
          path: dist/Distribuidor.apk
          if-no-files-found: error
